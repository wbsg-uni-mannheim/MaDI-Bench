domain: companies
master_seed: 42

# Sources are schema.org-style CSV files. Native id
# columns ship with the data and already carry the source-specific
# prefix (e.g. dbpedia ``entity_uri`` is ``http://dbpedia.org/...``,
# fullcontact ``Attribute_1`` is ``fullcontact_<n>``); the loader
# renames each ``id_column`` to ``id`` so downstream code keeps its
# ``id_column="id"`` assumption.
sources:
  - name: dbpedia
    file: dbpedia.csv
    format: csv
    id_prefix: "http://dbpedia.org/"
    id_column: entity_uri
  - name: forbes
    file: forbes.csv
    format: csv
    id_prefix: "http://www.forbes.com/"
    id_column: forbes_url
  - name: fullcontact
    file: fullcontact.csv
    format: csv
    id_prefix: "fullcontact_"
    id_column: Attribute_1

source_pairs:
  - [forbes, dbpedia]
  - [forbes, fullcontact]

fusion_files:
  validation: validation_set.xml
  test: test_set.xml

# Target_schema scope = 8 data attrs. `industry` is a
# target_schema attr that flows through SM (matched: dbpedia.sector +
# forbes.business_segment) / normalization (GICS) / EM (a matching field),
# but the fusion committee does not score it: fusion_committee.yaml lists
# only the 7 attrs name, country, city, assets, revenue, founded and
# keypeople. `website` is not a target attr: forbes.url == the id in all
# rows, degenerate.
attribute_classes:
  name: primary
  country: key
  city: key
  industry: secondary
  assets: secondary
  revenue: secondary
  founded: secondary
  keypeople: secondary
