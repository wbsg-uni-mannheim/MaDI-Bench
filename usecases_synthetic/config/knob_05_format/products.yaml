# Knob 05 — Format/Unit Diversity: Products domain config.
#
# Configured for the as-extracted
# sources of 2026-09-22. Per-domain baseline:
#   - The numeric attributes ship as the extractor produced them: plain
#     numbers whose unit is NOT uniform within a column (video memory in GB
#     or MB, capacity in GB or TB, dimensions in mm / cm / inch, weight in
#     g or kg). The base task's normalization test set grades recovering the
#     canonical unit from the value's magnitude and the product type. The
#     earlier ``file_size`` / ``rate`` classes assumed ONE implicit unit per
#     column (GB, MB/s) and rewrote the number into other units; on the
#     mixed-unit columns that assumption is wrong (an 8192-MB video-memory
#     cell would become "8388608 MB"), so those columns are now the
#     ``number`` family: locale-only reformatting (digit grouping, decimal
#     comma, plain) on top of the native unit mix, no unit rotation.
#   - price is a per-row-currency amount: every source carries a currency
#     column (GBP, USD, EUR, SEK, ZAR, ...), so a fixed implicit_currency
#     and a currency rotation would contradict the row's own currency
#     column. price is the ``number`` family too; the currency column is
#     untouched.
#   - The dimension and weight columns join the managed set (``number``) so
#     the locale rewrite covers every numeric attribute of the schema.
#   - No date attributes in the raw schema.
#   - description carries unit-style text (GB, GHz, ...) but those
#     belong to K6 / K1 noise + abbreviation handling, not K5.
# ``unit_pool_per_level`` stays empty: number reformatting is locale-only,
# no magnitude scaling (same layout as papers.yaml).

domain: products

# --- Attribute format family classification ---
# Shared with Knob 10 (comparator routing via reliability.reconcile_attribute_classes):
# the nine numeric columns of every source are ``number``.
attribute_classes:
  products_1:
    list_price: number
    video_memory_gb: number
    capacity_gb: number
    sequential_read_mb_s: number
    sequential_write_mb_s: number
    width_millimeters: number
    length_millimeters: number
    height_millimeters: number
    weight_grams: number
  products_2:
    priceAmount: number
    vramGb: number
    capacityGb: number
    readSpeedMbps: number
    writeSpeedMbps: number
    widthMm: number
    depthMm: number
    heightMm: number
    weightG: number
  products_3:
    Price: number
    MemorySizeGB: number
    CapacityGB: number
    ReadMBs: number
    WriteMBs: number
    WidthMM: number
    LengthMM: number
    HeightMM: number
    WeightG: number
  products_4:
    amt: number
    vram: number
    cap_gb: number
    rd_mbs: number
    wr_mbs: number
    w_mm: number
    l_mm: number
    h_mm: number
    wt_g: number

# --- ID columns (for provenance entity_id) ---
id_columns:
  products_1: id
  products_2: id
  products_3: id
  products_4: id

# --- Format pools per level ---
# Pinned pool sizes (per knob card): easy=2, medium=3, hard=4.
format_pools_per_level:
  easy:
    number:
      - en_US            # 1,234.5
      - plain            # 1234.5
  medium:
    number:
      - en_US
      - de_DE            # 1.234,5
      - plain
  hard:
    number:
      - en_US
      - de_DE
      - fr_FR            # 1 234,5
      - plain

locale_pool_per_level:
  easy:
    - en_US
  medium:
    - en_US
    - de_DE
  hard:
    - en_US
    - de_DE
    - fr_FR

within_source_consistency:
  easy: source    # one draw per (source, attribute)
  medium: source
  hard: row       # per-row draw

# No currency / byte / rate unit rotation on products any more (see header).
unit_pool_per_level:
  easy: {}
  medium: {}
  hard: {}

normalize_down_threshold: 0.85

# No implicit magnitude / currency / unit context: the numbers are rewritten
# as they stand.
source_magnitude_context: {}
