# Knob 03 — Per-source Attribute Drop Rate — Music
#
# Keyed on the LOADED column names of the base sources (2026-09-25 remap;
# the 2026-06-03 header rewrite put raw WDC headers on disk):
#   musicbrainz: Attribute_2=name, _3=artist, _4=release-date,
#                _5=release-country, _6=duration, _9=tracks
#   discogs:     title_str, performer, pub_dt, origin_loc, duration,
#                imprint (label), category (genre), tracks_track-name
#   lastfm:      album_title, band, album_length (duration),
#                tracks_track-name
# Schema-level absent attributes (musicbrainz.{genre,label} and lastfm.
# {release-country,genre,release-date,label} have no column on the base
# sources) are excluded from `attribute_classes` — they are Knob 9
# territory, not Knob 3.

domain: music

id_columns:
  musicbrainz: id
  discogs: id
  lastfm: id

attribute_classes:
  musicbrainz:
    Attribute_2: primary
    Attribute_3: key
    Attribute_5: key
    Attribute_4: secondary
    Attribute_6: secondary
    Attribute_9: secondary
  discogs:
    title_str: primary
    performer: key
    origin_loc: key
    category: key
    pub_dt: secondary
    duration: secondary
    imprint: secondary
    tracks_track-name: secondary
  lastfm:
    album_title: primary
    band: key
    album_length: secondary
    tracks_track-name: secondary

# Canonical attribute names match the fusion gold XML tags (release-country
# and release-date with hyphens, as in the music fusion val/test XML).
attribute_mapping:
  musicbrainz:
    Attribute_2: name
    Attribute_3: artist
    Attribute_5: release-country
    Attribute_4: release-date
    Attribute_6: duration
  discogs:
    title_str: name
    performer: artist
    origin_loc: release-country
    category: genre
    pub_dt: release-date
    duration: duration
    imprint: label
  lastfm:
    album_title: name
    band: artist
    album_length: duration

rates_per_level:
  easy:
    primary: 0.0
    key: 0.02
    secondary: 0.05
  medium:
    primary: 0.0
    key: 0.10
    secondary: 0.15
  hard:
    primary: 0.03
    key: 0.25
    secondary: 0.35

transform_per_level:
  easy: compress
  medium: identity
  hard: stretch

compression_factor: 0.7
stretch_factor: 1.5

single_source_survivor_cap_hard: 0.05
per_cell_ceiling_delta: 0.10

# Discogs duration is at 43% baseline (the loader coalesces the
# 0-sentinel rows to missing). Lastfm duration similar at 53%. Tighten
# ceilings so stretch does not demand negative headroom.
per_source_attribute_overrides:
  discogs:
    duration: 0.05
  lastfm:
    album_length: 0.05
