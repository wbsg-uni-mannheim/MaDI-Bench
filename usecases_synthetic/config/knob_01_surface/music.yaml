# Knob 01 - Surface Augmentation Intensity - Music
#
# Authored per knobs/knob_01_surface_augmentation.md.
#
# Keyed on the LOADED column names of the base sources at
# use cases/music/base/input/data/{musicbrainz,discogs,lastfm}.csv
# (2026-09-25 remap; the 2026-06-03 header rewrite put raw WDC headers
# on disk and dropped the all-empty columns):
#   musicbrainz: Attribute_2=name, _3=artist, _4=release-date,
#                _5=release-country, _6=duration, _9=tracks (no label)
#   discogs:     title_str=name, performer=artist, pub_dt=release-date,
#                origin_loc=release-country, imprint=label,
#                category=genre
#   lastfm:      album_title=name, band=artist (no release-country,
#                release-date, label, genre) - so lastfm K1 stays thin.
# Same native -> canonical mapping as the published base SM gold and the
# EM/fusion committee column_mapping blocks.
#
# Baseline easy -> medium for short fields (titles, artists, labels).
# No `paraphrase_long`. Hard LLM paraphrase uses the tightest
# contamination check of any domain - music titles are highly
# web-memorable.

domain: music

# ID columns: the loader renames each source's native id column
# (musicbrainz.Attribute_1 / discogs.rec_uid / lastfm.item_code, per
# config/domains/music.yaml id_column) to `id`.
id_columns:
  musicbrainz: id
  discogs: id
  lastfm: id

# Per-source column -> attribute class.
# musicbrainz has no label column and lastfm no release-country /
# release-date / label / genre column on the base sources, so they are
# not registered here.
attribute_classes:
  musicbrainz:
    Attribute_2: primary
    Attribute_3: key
    Attribute_5: key
    Attribute_4: secondary
  discogs:
    title_str: primary
    performer: key
    origin_loc: key
    category: categorical
    pub_dt: secondary
    imprint: secondary
  lastfm:
    album_title: primary
    band: key

# Source column -> canonical target attribute.
attribute_mapping:
  musicbrainz:
    Attribute_2: name
    Attribute_3: artist
    Attribute_5: release-country
    Attribute_4: release-date
  discogs:
    title_str: name
    performer: artist
    origin_loc: release-country
    category: genre
    pub_dt: release-date
    imprint: label
  lastfm:
    album_title: name
    band: artist

paraphrase_rate_primary:
  easy: 0.0
  medium: 0.04
  hard: 0.12
paraphrase_rate_key:
  easy: 0.0
  medium: 0.08
  hard: 0.18
paraphrase_rate_secondary:
  easy: 0.0
  medium: 0.16
  hard: 0.30
paraphrase_rate_categorical:
  easy: 0.0
  medium: 0.08
  hard: 0.18

operator_mix:
  easy:
    # Note: dormant under `paraphrase_rate_*.easy: 0.0` (the rate-based
    # dispatcher short-circuits before reaching operator sampling at easy).
    # The easy normalize-down work runs via `baseline_above_target_rules`
    # at a separate code path. Kept as defensive placeholder for any future
    # easy-rate bump.
    normalize_to_canonical: 1.0
  medium:
    abbreviate: 2.0
    eda_random_swap: 1.0
    eda_random_delete: 1.0
    llm_paraphrase: 1.0
  hard:
    abbreviate: 1.5
    eda_random_swap: 1.0
    eda_random_delete: 1.0
    llm_paraphrase: 3.0

# Easy-only normalize-down: harmonise country forms. Musicbrainz emits
# the long form ("United States of America", "United Kingdom of Great
# Britain and Northern Ireland"); discogs uses shorter forms ("USA",
# "UK"). Easy projects musicbrainz toward the shorter discogs sibling.
# `attribute` / `canonical_attribute` are loaded column names
# (musicbrainz.Attribute_5 / discogs.origin_loc = release-country).
baseline_above_target_rules:
  - source: musicbrainz
    attribute: Attribute_5
    canonical_from: discogs
    canonical_attribute: origin_loc
    strategy: shortest

# Music abbreviation table: countries, feat./vs. variants, volume/no./
# part suffixes, common parenthetical edition tags, label suffixes.
# ~25 entries. Article drop is handled
# by `article_drop_pattern` rather than enumerated entries.
abbreviation_table:
  # Country forms (release-country key column)
  "United States of America": "USA"
  "United States": "USA"
  "United Kingdom of Great Britain and Northern Ireland": "UK"
  "United Kingdom": "UK"
  "Great Britain": "UK"
  "Federal Republic of Germany": "Germany"
  # Featuring / versus
  "Featuring": "feat."
  "featuring": "feat."
  "with": "feat."
  "versus": "vs."
  "vs": "vs."
  # Album / single suffixes
  "Volume": "Vol."
  "Number": "No."
  "Part": "Pt."
  "(Original Soundtrack)": "(OST)"
  "(Remastered)": "(Remaster)"
  "(Deluxe Edition)": "(Deluxe)"
  "(Extended Version)": "(Extended)"
  # Label suffixes
  "Records": "Rec."
  "Recordings": "Rec."
  "Music": "Mus."
  "Entertainment": "Ent."

# Categorical vocab map (genre synonyms). Bidirectional.
categorical_vocab_map:
  "Hip-Hop": "Hip Hop"
  "Hip Hop": "Rap"
  "Rock and Roll": "Rock & Roll"
  "Rhythm and Blues": "R&B"
  "Electronic Dance Music": "EDM"
  "Drum and Bass": "DnB"

# Article drop pattern: leading-article removal on titles
# (e.g. "The Dark Side of the Moon" -> "Dark Side of the Moon").
# Used by the medium table-driven operator path.
article_drop_pattern: "^(The|A|An) "

stopword_list:
  - the
  - a
  - an
  - of
  - and

key_token_skiplist:
  musicbrainz:
    Attribute_2: []
  discogs:
    title_str: []
  lastfm:
    album_title: []

key_token_skiplist_global: []

# Hard-path LLM config. Default model is gpt-5.4-mini.
# `llm_temperature=0` is non-negotiable for music. Prompt version v2:
# minimum-divergence rule, <UNCHANGED> sentinel escape,
# per-attribute-class prompt split (primary/key -> short_v2,
# secondary -> secondary_v2, categorical -> categorical_v2). The prompt
# version and the model id are part of the cache key under
# cache/knob_01_paraphrases/<domain>/<level>/, so changing either
# invalidates the cache.
llm_prompt_version: v2
llm_model_id: gpt-5.4-mini
llm_temperature: 0.0

anchor_survivor_floor:
  primary: true
  key: false
  secondary: false
  categorical: false
