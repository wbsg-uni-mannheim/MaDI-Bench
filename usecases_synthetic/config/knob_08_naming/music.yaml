# Knob 08 — Schema Naming Divergence: Music
#
# Keyed on the LOADED column names of the base sources at
# use cases/music/base/input/data/{musicbrainz,discogs,lastfm}.csv.
# The 2026-06-03 header rewrite put raw WDC headers on disk, so the
# sources no longer share the canonical column set:
#   musicbrainz: Attribute_1 (id), Attribute_2..6, Attribute_9
#                (anonymized; no label / genre columns)
#   discogs:     rec_uid (id), title_str, performer, pub_dt, origin_loc,
#                duration, imprint, category, tracks_track-name
#   lastfm:      item_code (id), album_title, band, album_length,
#                tracks_track-name (no release-date / release-country /
#                label / genre columns)
# The loader renames each source's id column to `id`
# (config/domains/music.yaml id_column). The native -> canonical mapping
# below matches the published base gold
# (schemamatching/sm_mapping_gold.json) and the EM/fusion committee
# column_mapping blocks. The descriptive rung lifts each column to its
# canonical target attribute name.
#
# headers `name, artist, release-date, ...` for all three sources,
# including the all-empty musicbrainz label/genre and lastfm
# release-date/release-country/label/genre columns that the header
# rewrite dropped.)

level_assignments:
  easy:
    musicbrainz: descriptive
    discogs: descriptive
    lastfm: descriptive
  medium:
    musicbrainz: abbreviated
    discogs: descriptive
    lastfm: cryptic
  hard:
    musicbrainz: cryptic
    discogs: abbreviated
    lastfm: anonymized

# Ground-truth schema mapping: source_col -> target_col.
# Canonical target names match the target_schema.json properties, the
# fusion val/test XML element tags and the K10 attribute_mapping. `id`
# columns are intentionally OMITTED from rename_table.
sm_mapping:
  musicbrainz:
    id: id
    Attribute_2: name
    Attribute_3: artist
    Attribute_4: release-date
    Attribute_5: release-country
    Attribute_6: duration
    Attribute_9: tracks
  discogs:
    id: id
    title_str: name
    performer: artist
    pub_dt: release-date
    origin_loc: release-country
    duration: duration
    imprint: label
    category: genre
    tracks_track-name: tracks
  lastfm:
    id: id
    album_title: name
    band: artist
    album_length: duration
    tracks_track-name: tracks

