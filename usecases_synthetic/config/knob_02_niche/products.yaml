# Knob 02 - Entity Niche Density - Products
#
# Products sources are small (812/812/762/626 = 3012 rows total) — much
# smaller than companies/games/music. Per-level corner-ratio targets
# follow the companies ladder 0.20 / 0.50 / 0.80.

domain: products

id_columns:
  products_1: id
  products_2: id
  products_3: id
  products_4: id

primary_column_per_source:
  products_1: product_name
  products_2: name
  products_3: ProductTitle
  products_4: name

canonical_schema:
  - title
  - brand
  - description
  - price
  - priceCurrency
  - product_type
  - model
  - model_number
  - chipset_name
  - vram_gb
  - storage_gb

attribute_mapping:
  products_1:
    product_name: title
    manufacturer: brand
    product_description: description
    list_price: price
    currency_code: priceCurrency
    category: product_type
    model_name: model
    manufacturer_part_number: model_number
    gpu_chipset: chipset_name
    video_memory_gb: vram_gb
    capacity_gb: storage_gb
  products_2:
    name: title
    brandName: brand
    descriptionText: description
    priceAmount: price
    currency: priceCurrency
    productCategory: product_type
    modelName: model
    mpn: model_number
    chipset: chipset_name
    vramGb: vram_gb
    capacityGb: storage_gb
  products_3:
    ProductTitle: title
    Brand: brand
    Details: description
    Price: price
    Currency: priceCurrency
    Type: product_type
    Model: model
    PartNo: model_number
    Chipset: chipset_name
    MemorySizeGB: vram_gb
    CapacityGB: storage_gb
  products_4:
    name: title
    mfr: brand
    desc: description
    amt: price
    cur: priceCurrency
    cat: product_type
    mdl: model
    pn: model_number
    chip: chipset_name
    vram: vram_gb
    cap_gb: storage_gb

source_priority:
  - products_1
  - products_2
  - products_3
  - products_4

text_concat_order:
  - title
  - brand
  - description
  - product_type
  - model
  - chipset_name

# Same embedding model the other 3 active domains use. Switching it
# invalidates the on-disk embedding cache (the .meta.json carries
# model_id), forcing a deterministic rebuild on next K2 run.
embedding_model_id: BAAI/bge-base-en-v1.5

metrics:
  ext_jaccard: true
  tfidf: true
  embedding: true
  attribute_overlap: true
  label_collision: true

metric_top_k: 20
rrf_k0: 60
c_min: 2
boost_label_collision: 5.0
inner_token_threshold: 0.8

pair_miner_thresholds:
  t_match:
    ext_jaccard: 0.5
    tfidf: 0.4
    embedding: 0.6
  t_nonmatch:
    ext_jaccard: 0.5
    tfidf: 0.4
    embedding: 0.7

# Products attribute-overlap weights — brand + product_type partition
# the catalog (manufacturer × category); chipset_name is a strong
# discriminator within GPU/CPU sub-clusters; price is a noisy
# secondary signal.
attribute_overlap_weights:
  brand: 0.35
  product_type: 0.30
  chipset_name: 0.15
  price: 0.20

stopword_list:
  - the
  - a
  - an
  - of
  - and

# The dispatcher derives interpolation counts from the corner-pair gap
# and interp_pair_factor. max_interp_fraction (0.85) also caps the
# number of drop-corner-touching drops (max_interp_fraction x
# n_entities); at 0.60 that cap blocked the drops needed at easy and
# medium. 0.85 lets easy get closer to 0.20 and keeps K2 monotone
# across levels.
levels:
  easy:
    target_corner_case_ratio: 0.20
    removal_fraction_cap: 0.30
    interpolation_count: 0
  medium:
    target_corner_case_ratio: 0.50
    removal_fraction_cap: 0.10
  hard:
    target_corner_case_ratio: 0.80
    removal_fraction_cap: 0.05

max_interp_fraction: 0.85

# Same value as music, games and papers. The default 0.5 under-shot
# music's corner-pair target 7-15×; products has small clusters (max size 4)
# so the per-interpolation contribution is realistic at 1.0 corner pair
# per interp -> per_interp_corner = max(1, int(20*0.05)) = 1.
interp_pair_factor: 0.05

em_test_regeneration:
  target_size: 200
  candidate_pool_cap: 2000

# Half of the interpolated entities are placed across all sources
# (matched near-twins), half into a single source (distractors).
placement_split: 0.5

# Default model gpt-5.4-mini for cost. Bumping to gpt-5.4
# invalidates the on-disk LLM cache (the
# key carries model_id).
# The prompt version is part of the K2 LLM cache key.
llm_prompt_version: v2
llm_model_id: gpt-5.4-mini
llm_temperature: 0.0

# Drop-corner-touching operator + non-corner refill: when the baseline
# ratio is above the target, K2 drops corner-touching entities to move
# the ratio downward. Each drop pairs with a 1-for-1 LLM-synthesized
# non-corner entity refill so canonical set size stays stable.
non_corner_refill:
  enabled: true
  reference_count: 5            # K reference entities for the dissimilarity anchor
  contamination_check:
    label_collision_block: true # synthesised primary label must not exist in current canonical set
non_corner_prompt_version: v1

# Pool built 2026-05-15 from native ``cluster_id`` linkage via
# scripts/build_pool_products.py (separate from the PLM + rule-based
# build_pool.py used for companies/games/music).
pool_quality: live

# Hard-negative score-margin gate. cluster/slurm/run_em_train_committee.sbatch
# trains the products Ditto checkpoint at the path below.
hard_negative_gate:
  enabled: true
  plm_checkpoint_path: usecases_synthetic/cache/ditto_checkpoints/products/best
  plm_fields:
    - title
    - brand
    - description
    - model
    - model_number
    - product_type
    - chipset_name
    - vram_gb
    - storage_gb
  plm_threshold_theta: 0.61
  plm_max_len: 256
  plm_max_field_len: 350
  plm_batch_size: 16
  plm_margin_delta: 0.08
  # full_llm: the LLM adjudicates every gate decision; the PLM score is
  # recorded as audit telemetry only, so decisions do not depend on the
  # Ditto checkpoint's calibration (the pool builder's bucket-C policy).
  gate_mode: full_llm
  per_level:
    easy:
      enabled: true
      plm_margin_delta: 0.08
      gate_mode: full_llm
    medium:
      enabled: true
      plm_margin_delta: 0.08
      gate_mode: full_llm
    hard:
      enabled: true
      plm_margin_delta: 0.10
      gate_mode: full_llm
