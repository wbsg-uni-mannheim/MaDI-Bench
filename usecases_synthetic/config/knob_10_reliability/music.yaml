# Knob 10 — Source Reliability Differentiation: Music domain config.
#
# Keyed on the loaded CSV column names; the per-attribute winners are
# listed above attribute_targets.
#
# Eligible attributes (>=2 sources after the refreshed-CSV remap):
#   name (3), artist (3), release-date (2), release-country (2),
#   duration (2). genre and label are discogs-only post-refresh
#   (musicbrainz/lastfm 100% missing) so they are not eligible for K10.
# lastfm is mapped for name and artist only (it has no release-date or
# release-country column).

domain: music

id_columns:
  musicbrainz: id
  discogs: id
  lastfm: id

# Keyed on the LOADED column names of the base sources (2026-09-25 remap;
# the 2026-06-03 header rewrite put raw WDC headers on disk). Values are
# the canonical attribute names attribute_targets below is keyed on.
attribute_mapping:
  musicbrainz:
    Attribute_2: name
    Attribute_3: artist
    Attribute_4: release-date
    Attribute_5: release-country
    Attribute_6: duration
  discogs:
    title_str: name
    performer: artist
    pub_dt: release-date
    origin_loc: release-country
    category: genre
    imprint: label
    duration: duration
  lastfm:
    album_title: name
    band: artist

# Winner identity (curated-source-preferred where the measured baseline
# B[s, a] agrees; for two attributes the gold was authored from discogs):
#   name             -> musicbrainz (B=0.93 vs discogs 0.92)
#   artist           -> discogs     (B=0.84 vs musicbrainz 0.77 — gold from discogs)
#   release-date     -> musicbrainz (B=0.85 vs discogs 0.59)
#   release-country  -> musicbrainz (B=0.89 vs discogs 0.11)
#   duration         -> discogs     (B=0.56 vs musicbrainz 0.32 — gold from discogs)
attribute_targets:
  name:
    easy:
      musicbrainz: 0.85
      discogs: 0.10
      lastfm: 0.05
    medium:
      musicbrainz: 0.65
      discogs: 0.20
      lastfm: 0.15
    hard:
      musicbrainz: 0.40
      discogs: 0.30
      lastfm: 0.30
  artist:
    easy:
      musicbrainz: 0.10
      discogs: 0.85
      lastfm: 0.05
    medium:
      musicbrainz: 0.20
      discogs: 0.65
      lastfm: 0.15
    hard:
      musicbrainz: 0.30
      discogs: 0.40
      lastfm: 0.30
  release-date:
    easy:
      musicbrainz: 0.85
      discogs: 0.15
    medium:
      musicbrainz: 0.65
      discogs: 0.35
    hard:
      musicbrainz: 0.50
      discogs: 0.50
  release-country:
    easy:
      musicbrainz: 0.85
      discogs: 0.15
    medium:
      musicbrainz: 0.65
      discogs: 0.35
    hard:
      musicbrainz: 0.50
      discogs: 0.50
  duration:
    easy:
      musicbrainz: 0.15
      discogs: 0.85
    medium:
      musicbrainz: 0.35
      discogs: 0.65
    hard:
      musicbrainz: 0.50
      discogs: 0.50

compromise_rate_per_level:
  easy: 0.0
  medium: 0.05
  hard: 0.15

corr_strength_per_level:
  easy: 0.0
  medium: 0.20
  hard: 0.50

concentration_cap: 0.99
