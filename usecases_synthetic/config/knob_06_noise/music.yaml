# Knob 06 — Value Noise Injection Rate — Music
#
# Keyed on the LOADED column names of the base sources at
# use cases/music/base/input/data/ (2026-09-25 remap). The 2026-06-03
# header rewrite put raw WDC headers on disk and dropped the all-empty
# columns; the loader renames each native id column (musicbrainz.
# Attribute_1 / discogs.rec_uid / lastfm.item_code) to ``id``:
#   musicbrainz: Attribute_2=name, _3=artist, _4=release-date,
#                _5=release-country, _6=duration (no genre / label)
#   discogs:     title_str, performer, pub_dt, origin_loc, duration,
#                imprint (label), category (genre)
#   lastfm:      album_title, band, album_length (duration)
#                (no release-country / genre / release-date / label)
# Blocks: ``taxonomies`` (taxonomy_walk bindings for Music_Genres,
# discogs.category only) and ``numeric_attributes`` (±2% relative
# jitter cap).

domain: music

id_columns:
  musicbrainz: id
  discogs: id
  lastfm: id

attribute_classes:
  musicbrainz:
    Attribute_2: primary
    Attribute_3: key
    Attribute_5: key
    Attribute_4: secondary
    Attribute_6: secondary
  discogs:
    title_str: primary
    performer: key
    origin_loc: key
    category: key
    pub_dt: secondary
    duration: secondary
    imprint: secondary
  lastfm:
    album_title: primary
    band: key
    album_length: secondary

# Source column to canonical attribute (per
# config/domains/music.yaml: name / artist / release-country / genre /
# release-date / duration / label).
attribute_mapping:
  musicbrainz:
    Attribute_2: name
    Attribute_3: artist
    Attribute_5: release-country
    Attribute_4: release-date
    Attribute_6: duration
  discogs:
    title_str: name
    performer: artist
    origin_loc: release-country
    category: genre
    pub_dt: release-date
    duration: duration
    imprint: label
  lastfm:
    album_title: name
    band: artist
    album_length: duration

noise_rates_per_level:
  easy:
    primary: 0.0
    key: 0.0
    secondary: 0.01
  medium:
    primary: 0.0
    key: 0.02
    secondary: 0.04
  hard:
    primary: 0.01
    key: 0.06
    secondary: 0.12

transform_per_level:
  easy: compress
  medium: identity
  hard: stretch

operator_mix:
  easy:
    whitespace_corrupt: 1.0
    case_corrupt: 1.0
  medium:
    whitespace_corrupt: 1.0
    case_corrupt: 1.0
    typo_substitute: 1.5
    ocr_confuse: 1.0
    taxonomy_walk: 1.0
  hard:
    whitespace_corrupt: 0.5
    case_corrupt: 0.5
    typo_substitute: 2.0
    ocr_confuse: 1.5
    truncate: 1.0
    taxonomy_walk: 1.5

max_edits_per_cell:
  easy: 1
  medium: 1
  hard: 3

max_ocr_per_cell:
  easy: 1
  medium: 1
  hard: 2

max_truncate_chars:
  easy: 1
  medium: 2
  hard: 3

soft_global_primary_cap_hard: 0.35

compression_factor: 0.5
stretch_factor: 1.5

# Taxonomy bindings. Music_Genres_Taxonomy is 3-level
# (Genre → Subgenre → Sub-Subgenre).
taxonomies:
  genre:
    csv: music/input/schemamatching/Music_Genres_Taxonomy.csv
    levels:
      - Genre Name
      - Subgenre Name
      - Sub-Subgenre Name
    bind:
      discogs:
        category: genre

# ±2 % relative jitter cap. ``duration`` is in seconds (raw
# float / int), so the cap applies to seconds.
numeric_jitter_max_relative: 0.02

numeric_attributes:
  musicbrainz:
    Attribute_4: date
    Attribute_6: continuous
  discogs:
    pub_dt: date
    duration: continuous
  lastfm:
    album_length: continuous

# Easy-only cleanup rules: lastfm.album_title (= name) carries an
# "Artist - Title" prefix on 1365/9865 records (verified 2026-05-07).
# Strip the leading "<artist> - " segment at easy.
cleanup_rules:
  - source: lastfm
    attribute: album_title
    pattern: '^.+?\s+-\s+'
    replacement: ""
