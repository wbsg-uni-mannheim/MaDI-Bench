# End-to-end panel configuration for the companies tasks (score_e2e.py).
# The keys below are the ones the panel reads, copied unchanged from the
# configuration the paper's panels were computed with (the best-of-breed
# pipeline's companies config of 2026-07, with PyDI's names for the column types).

domain: companies

column_types:
  id: identifier
  cluster_id: identifier
  name: text
  founded: datetime  # PyDI's panel type name ("temporal" in pipelines/configs/companies.yaml)
  country: categorical
  city: categorical
  industry: categorical
  assets: numerical
  revenue: numerical
  keypeople: list  # array of names; handled at cluster level (skip distributional)
  sector: categorical
  website: identifier  # Forbes source URL, not a real website — declared so it is not silently undeclared, but excluded from value scoring like products' url

# Panel numerical tolerance. Companies notebook uses
# numeric_tolerance_match(tolerance=0.1) for revenue and assets.
panel_tolerance:
  default: 0.05
  overrides:
    assets: 0.10
    revenue: 0.10

composite_weights:
  entity_coverage: 0.10
  fact_coverage: 0.10
  source_based_fact_coverage: 0.10
  consistency: 0.10
  cluster_correctness: 0.30
  fact_correctness: 0.30

# Forbes + dbpedia ids are full URIs; fullcontact ids are short. The
# panel matches by startswith() so the long URIs are uniquely
# attributable to their source.
source_prefix_map:
  "http://www.forbes.com/": forbes
  "http://dbpedia.org/": dbpedia
  fullcontact_: fullcontact
