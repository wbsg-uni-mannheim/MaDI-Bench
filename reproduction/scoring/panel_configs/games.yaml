# End-to-end panel configuration for the games tasks (score_e2e.py).
# The keys below are the ones the panel reads, copied unchanged from the
# configuration the paper's panels were computed with (the best-of-breed
# pipeline's games config of 2026-07, with PyDI's names for the column types).

domain: games

column_types:
  id: identifier
  cluster_id: identifier
  name: text
  releaseYear: datetime  # PyDI's panel type name ("temporal" in pipelines/configs/games.yaml)
  developer: text
  genres: list  # array of Genre Names (taxonomy top level, NOT subgenres);
                # handled at cluster level (skip distributional)
  publisher: text
  platform: categorical
  criticScore: numerical
  userScore: numerical
  ESRB: categorical
  series: categorical
  globalSales: numerical

# Panel numerical tolerance. Games notebook uses
# numeric_tolerance_match(tolerance=2) for criticScore (0-100) and
# tolerance=0.2 for userScore (0-10). Translated to relative tolerances:
panel_tolerance:
  default: 0.05
  overrides:
    criticScore: 0.04
    userScore: 0.04

composite_weights:
  entity_coverage: 0.10
  fact_coverage: 0.10
  source_based_fact_coverage: 0.10
  consistency: 0.10
  cluster_correctness: 0.30
  fact_correctness: 0.30

source_prefix_map:
  dbpedia_: dbpedia
  metacritic_: metacritic
  sales_: sales
