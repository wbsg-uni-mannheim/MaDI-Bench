# Blocking-only copy (Table 6, P2 re-scoring): pipelines/configs/papers.yaml with sm/norm/refinement/fusion enabled: false; em stays enabled (blocking + matching are one joint pipeline stage; p2_blocking_only.py runs its blocking phase only, the matchers are never executed). Nothing else changed.
# Best-of-breed pipeline config for papers.
#
# Papers sources: dblp (anchor for fusion), crossref, open_alex. Record
# ids ship in each source's id column in the form "<source>-NNNNN",
# matching what the EM gold under input/entitymatching/ references.
#
# Source pairs: (dblp, crossref) and (dblp, open_alex). The EM gold
# files are dblp_<other>_{train,val,test}.csv with columns
# id_dblp,id_<other>,label — the canonical_loader renames them to
# the standard id1,id2,label shape in-memory.
#
# load_pipeline_bundle loads the base task (use cases/papers/base/) via
# pipelines/lib/canonical_loader.py regardless of bundle_source; the
# variants (use cases/papers/<level>/) load via usecases_synthetic
# variant_loader.load_variant.
#
# Caveats:
#   - The SM committee reads the source files as shipped and scores
#     every member against the shipped SM gold (sm_mapping_gold.json at
#     base, sm_mapping.csv for a variant); no later stage reads the SM
#     winner's mapping.
#
# LLM members default OFF in EM matching + Fusion;
# LLM stays ON in SM.

domain: papers

bundle_source: canonical

stages:
  sm:
    enabled: false
    selection_metric: f1
  norm:
    enabled: false
    selection_metric: macro_f1
    apply_winner: false
    vacuous_epsilon: 0.005
    # Score normalized outputs against the papers target_schema's
    # JSON-Schema constraints + x-pydi-consistency rules (publication_year
    # min/max, page_locator with cross-field comparison, type enum). See
    # pipelines/lib/schema_constraint_scorer.py. The xml_targets surface
    # does not work for papers: usecases_synthetic/lib/protection.py has
    # no per-attribute kind map for papers, so no attribute is eligible.
    scoring_surface: schema_constraints
  em:
    enabled: true
    blocking_selection_metric: reduction_ratio
    matching_selection_metric: f1
    clustering: greedy
  refinement:
    enabled: false
    methods: [baseline, greedy, mbm]
    selection_metric: f1
  fusion:
    enabled: false
    selection_metric: macro_accuracy

# Column type config for the e2e panel.
column_types:
  id: identifier
  cluster_id: identifier
  doi: identifier
  type: categorical
  title: text
  authors: list  # array of author names; handled at cluster level (skip distributional)
  publication_year: temporal
  journal: text
  publisher: categorical
  keywords: text
  volume: categorical
  issue: categorical
  first_page: numerical
  last_page: numerical
  referenced_works_count: numerical
  cited_by_count: numerical

# Papers notebook uses prefer_higher_trust(trust_map) on
# referenced_works_count + last_page, voting on most others.
# numeric_tolerance_match defaults to 0.10 relative tolerance for the
# two counts.
panel_tolerance:
  default: 0.05
  overrides:
    referenced_works_count: 0.10
    cited_by_count: 0.10

composite_weights:
  entity_coverage: 0.10
  fact_coverage: 0.10
  source_based_fact_coverage: 0.10
  consistency: 0.10
  cluster_correctness: 0.30
  fact_correctness: 0.30

# Source ids have the form "<source>-NNNNN" — note the dash separator.
source_prefix_map:
  dblp-: dblp
  crossref-: crossref
  open_alex-: open_alex
