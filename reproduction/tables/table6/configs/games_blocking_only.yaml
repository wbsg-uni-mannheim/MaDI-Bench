# Blocking-only copy (Table 6, P2 re-scoring): pipelines/configs/games.yaml with sm/norm/refinement/fusion enabled: false; em stays enabled (blocking + matching are one joint pipeline stage; p2_blocking_only.py runs its blocking phase only, the matchers are never executed). Nothing else changed.
# Best-of-breed pipeline config for games.
#
# Games sources: dbpedia, metacritic (anchor for fusion eval),
# sales. Two declared pairs per usecases_synthetic/config/domains/games.yaml:
# (dbpedia, sales) and (metacritic, dbpedia). The (metacritic, sales)
# pair is intentionally absent.
#
# LLM members default OFF in EM matching + Fusion;
# LLM stays ON in SM.

domain: games

bundle_source: synthetic_baseline

stages:
  sm:
    enabled: false
    selection_metric: f1
  norm:
    enabled: false
    selection_metric: macro_f1
    apply_winner: false
    vacuous_epsilon: 0.005
    # Score normalized outputs against the games target_schema's
    # JSON-Schema constraints + x-pydi-consistency rules (date_range
    # on releaseYear, numeric ranges on criticScore/userScore, plus
    # x-pydi-taxonomy on genres/platform/ESRB). See
    # pipelines/lib/schema_constraint_scorer.py.
    scoring_surface: schema_constraints
  em:
    enabled: true
    blocking_selection_metric: reduction_ratio
    matching_selection_metric: f1
    clustering: greedy
  refinement:
    enabled: false
    methods: [baseline, greedy, mbm]
    selection_metric: f1
  fusion:
    enabled: false
    selection_metric: macro_accuracy

# Column type config for the e2e panel.
# Derived from use cases/games/base/input/schemamatching/target_schema.json.
column_types:
  id: identifier
  cluster_id: identifier
  name: text
  releaseYear: temporal
  developer: text
  genres: list  # array of subgenres; handled at cluster level (skip distributional)
  publisher: text
  platform: categorical
  criticScore: numerical
  userScore: numerical
  ESRB: categorical
  series: categorical
  globalSales: numerical

# Panel numerical tolerance. Games notebook uses
# numeric_tolerance_match(tolerance=2) for criticScore (0-100) and
# tolerance=0.2 for userScore (0-10). Translated to relative tolerances:
panel_tolerance:
  default: 0.05
  overrides:
    criticScore: 0.04
    userScore: 0.04

composite_weights:
  entity_coverage: 0.10
  fact_coverage: 0.10
  source_based_fact_coverage: 0.10
  consistency: 0.10
  cluster_correctness: 0.30
  fact_correctness: 0.30

source_prefix_map:
  dbpedia_: dbpedia
  metacritic_: metacritic
  sales_: sales
